version: "3"
services:
  app:
    build:
      context: .
      dockerfile: .Dockerfile
    ports:
      - "37111:4000"
    environment:
      - MONGO_URI=mongodb://admin:secret@mongodb:27017
      - DB_NAME=invoicerdb
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: